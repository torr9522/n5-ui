<!DOCTYPE html>
<html lang="en">
{{template "head" .}}
<body>
<a-layout id="app" v-cloak>
    {{ template "commonSider" . }}
    <a-layout id="content-layout">
        <a-layout-content style="margin: 24px 16px;">
            <a-card title="N5 分流状态" style="margin-bottom: 16px;">
                <a-row type="flex" justify="space-between" align="middle">
                    <a-col>
                        <a-tag :color="n5Enabled ? 'green' : 'default'">
                            [[ n5Enabled ? 'enabled' : 'disabled' ]]
                        </a-tag>
                        <span style="color: rgba(0, 0, 0, 0.45);">
                            当前状态与高级设置中的 N5 Xray Extension Enable 保持一致。修改后将进入自动应用队列。
                        </span>
                    </a-col>
                    <a-col>
                        <a-button type="primary"
                                  :loading="n5StatusLoading"
                                  :disabled="n5Enabled"
                                  @click="updateN5Status(true)">
                            开启
                        </a-button>
                        <a-button style="margin-left: 8px"
                                  :loading="n5StatusLoading"
                                  :disabled="!n5Enabled"
                                  @click="updateN5Status(false)">
                            关闭
                        </a-button>
                    </a-col>
                </a-row>
            </a-card>
            <a-card title="添加出口规则">
                <a-form layout="vertical">
                    <a-row :gutter="12">
                        <a-col :xs="24" :sm="8">
                            <a-form-item label="入口节点">
                                <a-select v-model="form.inboundId" style="width: 100%">
                                    <a-select-option v-for="item in inbounds" :key="item.id" :value="item.id">
                                        [[ item.name ]]
                                    </a-select-option>
                                </a-select>
                            </a-form-item>
                        </a-col>
                        <a-col :xs="24" :sm="8">
                            <a-form-item label="流量类型">
                                <a-select v-model="form.trafficType" style="width: 100%">
                                    <a-select-option v-for="item in trafficTypes" :key="item.value" :value="item.value">
                                        [[ item.label ]]
                                    </a-select-option>
                                </a-select>
                            </a-form-item>
                        </a-col>
                        <a-col :xs="24" :sm="8">
                            <a-form-item label="出口">
                                <a-select v-model="form.egressId" style="width: 100%">
                                    <a-select-option v-for="item in egresses" :key="item.id" :value="item.id">
                                        [[ item.name ]]
                                    </a-select-option>
                                </a-select>
                            </a-form-item>
                        </a-col>
                    </a-row>
                    <a-row :gutter="12" v-if="form.trafficType === 'group'">
                        <a-col :xs="24" :sm="16">
                            <a-form-item label="分流规则组">
                                <a-select v-model="form.groupId" style="width: 100%" placeholder="选择分流规则组">
                                    <a-select-option v-for="item in groups" :key="item.id" :value="item.id">
                                        [[ item.name ]] ([[ item.ruleCount ]])
                                    </a-select-option>
                                </a-select>
                            </a-form-item>
                        </a-col>
                        <a-col :xs="24" :sm="8" style="display:flex;align-items:center;">
                            <a-button style="margin-top: 6px" @click="openTrafficRules">管理分流规则</a-button>
                        </a-col>
                    </a-row>
                    <a-row :gutter="12" v-if="form.trafficType === 'custom-domain'">
                        <a-col :xs="24" :sm="16">
                            <a-form-item label="自定义域名">
                                <a-input v-model.trim="form.customDomain" placeholder="支持 full:api.ipify.org / domain:openai.com / keyword:netflix"></a-input>
                            </a-form-item>
                        </a-col>
                    </a-row>
                    <a-button type="primary" @click="createRule">添加</a-button>
                    <a-button style="margin-left: 8px" @click="resetForm">重置</a-button>
                    <a-button style="margin-left: 8px" @click="openSimpleEgress">返回出口</a-button>
                    <a-button style="margin-left: 8px" @click="openTrafficRules">分流规则</a-button>
                </a-form>
            </a-card>

            <a-card title="规则列表" style="margin-top: 16px;">
                <a-table :data-source="rules" :pagination="false" :row-key="row => row.id">
                    <a-table-column title="入口">
                        <template slot-scope="text, row">
                            [[ row.inboundName ]]
                        </template>
                    </a-table-column>
                    <a-table-column title="流量类型">
                        <template slot-scope="text, row">
                            <span>[[ row.trafficLabel ]]</span>
                            <div v-if="row.groupName" style="color: rgba(0, 0, 0, 0.45); font-size: 12px;">
                                规则组: [[ row.groupName ]]
                            </div>
                            <div v-if="row.customDomain" style="color: rgba(0, 0, 0, 0.45); font-size: 12px;">
                                [[ row.customDomain ]]
                            </div>
                        </template>
                    </a-table-column>
                    <a-table-column title="来源">
                        <template slot-scope="text, row">
                            <span v-if="row.trafficType === 'group'">[[ row.groupName || '分流规则组' ]]</span>
                            <span v-else-if="row.trafficType === 'custom-domain'">自定义</span>
                            <span v-else>[[ row.trafficLabel ]]</span>
                        </template>
                    </a-table-column>
                    <a-table-column title="出口">
                        <template slot-scope="text, row">
                            [[ row.egressName ]]
                        </template>
                    </a-table-column>
                    <a-table-column title="状态">
                        <template slot-scope="text, row">
                            <a-tag :color="row.enabled ? 'green' : 'default'">[[ row.status ]]</a-tag>
                        </template>
                    </a-table-column>
                    <a-table-column title="操作">
                        <template slot-scope="text, row">
                            <a-button size="small" type="danger" @click="deleteRule(row)">删除</a-button>
                        </template>
                    </a-table-column>
                </a-table>
            </a-card>
        </a-layout-content>
    </a-layout>
</a-layout>
{{template "js" .}}
<script>
    const defaultRuleForm = () => ({
        inboundId: undefined,
        trafficType: 'all',
        groupId: undefined,
        egressId: undefined,
        customDomain: '',
    });

    const app = new Vue({
        el: '#app',
        delimiters: ['[[', ']]'],
        data: {
            siderDrawer,
            rules: [],
            inbounds: [],
            egresses: [],
            groups: [],
            trafficTypes: [],
            form: defaultRuleForm(),
            n5Enabled: false,
            n5StatusLoading: false,
        },
        methods: {
            async loadN5Status() {
                this.n5StatusLoading = true;
                const msg = await HttpUtil.get('/n5/api/simple/rule/n5-status');
                this.n5StatusLoading = false;
                if (!msg.success || !msg.obj) {
                    return;
                }
                this.n5Enabled = !!msg.obj.enabled;
            },
            async loadRules() {
                const msg = await HttpUtil.get('/n5/api/simple/rule/list');
                if (!msg.success || !msg.obj) {
                    return;
                }
                this.rules = msg.obj.rules || [];
                this.inbounds = msg.obj.inbounds || [];
                this.egresses = msg.obj.egresses || [];
                this.groups = msg.obj.groups || [];
                this.trafficTypes = msg.obj.trafficTypes || [];
                if (!this.form.inboundId && this.inbounds.length > 0) {
                    this.form.inboundId = this.inbounds[0].id;
                }
                if (!this.form.egressId && this.egresses.length > 0) {
                    this.form.egressId = this.egresses[0].id;
                }
                if (!this.form.groupId && this.groups.length > 0) {
                    this.form.groupId = this.groups[0].id;
                }
            },
            resetForm() {
                this.form = defaultRuleForm();
                if (this.inbounds.length > 0) {
                    this.form.inboundId = this.inbounds[0].id;
                }
                if (this.egresses.length > 0) {
                    this.form.egressId = this.egresses[0].id;
                }
                if (this.groups.length > 0) {
                    this.form.groupId = this.groups[0].id;
                }
            },
            async createRule() {
                const payload = Object.assign({}, this.form);
                if (payload.trafficType !== 'custom-domain') {
                    payload.customDomain = '';
                }
                if (payload.trafficType !== 'group') {
                    payload.groupId = 0;
                }
                const msg = await HttpUtil.post('/n5/api/simple/rule/add', payload);
                if (msg.success) {
                    this.$message.success('规则已保存，等待自动应用');
                    await this.loadRules();
                    this.resetForm();
                }
            },
            async deleteRule(row) {
                const msg = await HttpUtil.post('/n5/api/simple/rule/delete', { id: row.id });
                if (msg.success) {
                    this.$message.success('规则已删除，等待自动应用');
                    await this.loadRules();
                }
            },
            async updateN5Status(enabled) {
                this.n5StatusLoading = true;
                const msg = await HttpUtil.post('/n5/api/simple/rule/n5-status', { enabled });
                this.n5StatusLoading = false;
                if (!msg.success) {
                    return;
                }
                this.n5Enabled = !!(msg.obj && msg.obj.enabled);
                this.$message.success('N5 分流状态已更新，等待自动应用');
            },
            openSimpleEgress() {
                location.href = `${basePath}n5/simple`;
            },
            openTrafficRules() {
                location.href = `${basePath}n5/simple/traffic-rules`;
            },
        },
        async mounted() {
            await this.loadN5Status();
            await this.loadRules();
            this.resetForm();
        },
    });
</script>
</body>
</html>
