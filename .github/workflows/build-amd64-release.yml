name: Build AMD64 release package

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-amd64:
    runs-on: ubuntu-latest
    container: debian:11
    steps:
      - name: Configure Debian 11 archive packages
        run: |
          sed -i \
            -e 's|deb.debian.org/debian-security|archive.debian.org/debian-security|g' \
            -e 's|security.debian.org/debian-security|archive.debian.org/debian-security|g' \
            /etc/apt/sources.list
          rm -rf /var/lib/apt/lists/*
          apt-get -o Acquire::Check-Valid-Until=false update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            ca-certificates curl file gcc git libc6-dev rsync tar unzip zip

      - uses: actions/checkout@v4

      - name: Install verified Go 1.26.0
        run: |
          curl -fL --retry 3 -o /tmp/go.tar.gz \
            https://go.dev/dl/go1.26.0.linux-amd64.tar.gz
          echo 'aac1b08a0fb0c4e0a7c1555beb7b59180b05dfc5a3d62e40e9de90cd42f88235  /tmp/go.tar.gz' \
            | sha256sum -c -
          tar -C /opt -xzf /tmp/go.tar.gz
          mv /opt/go /opt/go1.26.0

      - name: Test and build panel
        run: |
          /opt/go1.26.0/bin/go test ./...
          scripts/build-panel.sh amd64 /tmp/x-ui-linux-amd64 /opt/go1.26.0/bin/go

      - name: Fetch immutable AMD64 Golden runtime
        run: |
          curl -fL --retry 3 -o /tmp/Xray-linux-64.zip \
            https://github.com/torr9522/n5-ui/releases/download/v0.2.0/Xray-linux-64.zip
          echo '98e1cfe7b8a85d833edcd5101530f2d67609505d832eac15ac2a236f3374bbbe  /tmp/Xray-linux-64.zip' \
            | sha256sum -c -

      - name: Package and audit
        run: |
          scripts/package-release.sh \
            amd64 \
            /tmp/x-ui-linux-amd64 \
            /tmp/Xray-linux-64.zip \
            /tmp/release
          file /tmp/x-ui-linux-amd64
          sha256sum /tmp/release/x-ui-linux-amd64.tar.gz \
            /tmp/Xray-linux-64.zip > /tmp/release/AMD64-SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: n5-ui-linux-amd64
          path: |
            /tmp/release/x-ui-linux-amd64.tar.gz
            /tmp/release/AMD64-SHA256SUMS
          if-no-files-found: error
